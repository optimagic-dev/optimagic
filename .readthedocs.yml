---
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: '3.14'
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    post_build:
      - pixi run --locked -e docs build-docs
      # The exporter can log a failed Markdown subprocess without failing Sphinx.
      - test -s docs/build/html/llms.txt
      - mkdir --parents $READTHEDOCS_OUTPUT/html/
      - cp -a docs/build/html/. "$READTHEDOCS_OUTPUT/html" && rm -r docs/build
