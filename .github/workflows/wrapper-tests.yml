---
# Tests of the wrapped optimizer libraries against their newest release, to detect
# upstream changes. They run once a month and can be started by hand. For every pull
# request, the main workflow runs the same tests with the library versions in the lock
# file.
permissions:
  contents: read
name: wrapper-tests
on:
  schedule:
    - cron: 0 5 1 * *
  workflow_dispatch: null
jobs:
  run-wrapper-tests:
    name: Run ${{ matrix.library }} tests with the newest release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Libraries that have wrapper tests, with their packages. Add a library when
        # you add its wrapper tests.
        include:
          - library: fides
            packages: fides
          - library: nag
            packages: dfo-ls py-bobyqa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
        with:
          pixi-version: v0.71.2
          cache: true
          cache-write: false
          frozen: true
          environments: tests-${{ matrix.library }}
      - name: Update the wrapped library to its newest release
        shell: bash -el {0}
        run: pixi update -e tests-${{ matrix.library }} ${{ matrix.packages }}
      - name: Run pytest
        shell: bash -el {0}
        run: >-
          pixi run -e tests-${{ matrix.library }} tests
          --library ${{ matrix.library }}
