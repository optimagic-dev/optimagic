    "gradient_free_optimizers.optimizers.base_optimizer",
  ]


# ======================================================================================
# Pixi configuration
# ======================================================================================
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

# --- Base dependencies (all environments) -------------------------------------------
[tool.pixi.dependencies]
python = ">=3.13,<3.16"
# Prefer conda-forge builds for compiled scientific packages
numpy = ">=2.2"
scipy = ">=1.15"
pandas = ">=2.3"
jupyterlab = ">=4.0"
statsmodels = ">=0.14"
matplotlib = ">=3.8"
bokeh = ">=3.2"
altair = ">=5.1"
seaborn = ">=0.13"
pyyaml = ">=6.0.1"
pydantic = ">=2.10"
jinja2 = ">=3.1"
ruff = ">=0.15.5,<0.16"
# Needed by kaleido. PyPI has no wheels for the newest Python version yet.
orjson = "*"

[tool.pixi.pypi-dependencies]
optimagic = { path = ".", editable = true }
pdbp = "*"
kaleido = ">=0.2.1"

# --- Python version features --------------------------------------------------------
[tool.pixi.feature.py313.dependencies]
python = "~=3.13.0"
[tool.pixi.feature.py314.dependencies]
python = "~=3.14.0"
[tool.pixi.feature.py315.dependencies]
python = "~=3.15.0"

# --- Feature: tests (test infrastructure) --------------------------------------------
[tool.pixi.feature.tests.dependencies]
pytest = ">=7.2"
pytest-cov = ">=4.0"
pytest-xdist = ">=3.2"

[tool.pixi.feature.tests.tasks]
# The tasks run the tests in parallel on all CPU cores. Add `-n 0` to run them in one
# process, e.g. for debugging with --pdb.
tests = { cmd = "pytest -n auto", description = "Run the full test suite" }
tests-fast = { cmd = "pytest -n auto -m 'not slow and not jax'", description = "Run tests excluding slow and jax tests" }
tests-with-cov = { cmd = "pytest -n auto --cov-report=xml --cov=src --cov=tests", description = "Run tests with XML coverage report for source and test code" }

# --- Feature: type-checking (ty + type stubs) --------------------------------------
[tool.pixi.feature.type-checking.dependencies]
ty = ">=0.0.59,<0.0.60"

[tool.pixi.feature.type-checking.pypi-dependencies]
pandas-stubs = "*"
types-cffi = "*"
types-openpyxl = "*"
types-jinja2 = "*"

[tool.pixi.feature.type-checking.tasks]
ty = { cmd = "ty check", description = "Run ty type checker" }
ty-concise = { cmd = "ty check --output-format concise", description = "Run ty type checker with concise output" }
ty-fix = { cmd = "ty check --fix", description = "Run ty type checker and apply safe fixes" }

# --- Feature: linux (Linux-only deps) ------------------------------------------------
[tool.pixi.feature.linux]
platforms = ["linux-64"]
[tool.pixi.feature.linux.dependencies]
jax = ">=0.4.8"

# --- Features: optimizer libraries -------------------------------------------------
# One feature per optimizer library. Each library is tested in its own environment
# (tests-<feature>), so libraries never have to be installable together. The feature
# names equal the pytest markers of the libraries.
[tool.pixi.feature.bayesopt.dependencies]
# PyPI has no scikit-learn wheels for the newest Python version yet.
scikit-learn = "*"
[tool.pixi.feature.bayesopt.pypi-dependencies]
bayesian-optimization = ">=1.4"

[tool.pixi.feature.fides.dependencies]
# PyPI has no h5py wheels for the newest Python version yet.
h5py = "*"
[tool.pixi.feature.fides.pypi-dependencies]
fides = "==0.7.4"

[tool.pixi.feature.gfo.pypi-dependencies]
gradient-free-optimizers = ">=1.6.0"
# gradient-free-optimizers (up to at least 1.13.0) declares pandas<3, but our tests of it
# pass with pandas 3. Remove the override once a release without the cap is available.
[tool.pixi.feature.gfo.pypi-options.dependency-overrides]
pandas = ">=2.3"

[tool.pixi.feature.iminuit.dependencies]
iminuit = ">=2.25"

[tool.pixi.feature.ipopt.dependencies]
cyipopt = ">=1.4.0"

[tool.pixi.feature.nag.pypi-dependencies]
dfo-ls = ">=1.5.3"
py-bobyqa = ">=1.3"

# nevergrad_bo needs bayes-optim, which needs torch and scikit-learn. The conda-forge
# CPU build of torch keeps the PyPI resolver from installing the much larger CUDA build.
[tool.pixi.feature.nevergrad.dependencies]
pytorch-cpu = "*"
scikit-learn = "*"
# nevergrad 1.0.12 calls float() on an array with one element, which numpy >= 2.4
# rejects. Optimizers that use nevergrad's metamodel, e.g. NgIoh4 or Wiz, then crash and
# leave a thread behind that keeps Python from exiting. This is fixed in nevergrad's
# main branch (facebookresearch/nevergrad#1707); remove the cap once a nevergrad
# release contains the fix.
numpy = "<2.4"
[tool.pixi.feature.nevergrad.pypi-dependencies]
nevergrad = "*"
bayes-optim = "*"
# bayes-optim imports the module pyDOE, which pyDOE renamed to pydoe in version 1.0.
pydoe = "<0.4"

[tool.pixi.feature.nlopt.dependencies]
nlopt = ">=2.7"

[tool.pixi.feature.pygad.dependencies]
pygad = ">=3.2"

[tool.pixi.feature.pygmo.dependencies]
pygmo = ">=2.19.0"

[tool.pixi.feature.pyswarms.pypi-dependencies]
pyswarms = ">=1.3"

# petsc4py is only available on Linux, so tao is not part of the environments that
# combine optimizer libraries (default, docs, type-checking). Moreover, on Python 3.15 it
# cannot be installed together with cyipopt and pygmo: their conda-forge builds need the
# int64 variant of libscotch, while petsc >= 3.26 (the only petsc with Python 3.15
# support) needs the int32 one.
[tool.pixi.feature.tao]
platforms = ["linux-64"]
[tool.pixi.feature.tao.dependencies]
petsc4py = ">=3.18"

[tool.pixi.feature.tranquilo.dependencies]
tranquilo = ">=0.1.1"

# --- Feature: docs -------------------------------------------------------------------
[tool.pixi.feature.docs.dependencies]
sphinx = ">=8.2.3"
sphinxcontrib-bibtex = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx-llm = ">=1.1.0"
ipython = "*"
ipython_genutils = "*"
myst-nb = "*"
furo = "*"
anywidget = "*"
patsy = "*"

[tool.pixi.feature.docs.pypi-dependencies]
sphinxcontrib-mermaid = "*"
intersphinx-registry = "*"

[tool.pixi.feature.docs.tasks]
build-docs = { cmd = "make html", cwd = "docs", description = "Build the HTML documentation" }

# --- Compat features (version overrides for backward-compat CI) ---------------------
# Following SPEC 0, pandas 2.3 is supported until June 2027, two years after its release.
[tool.pixi.feature.old-pandas.dependencies]
pandas = "<3"

# --- Environments --------------------------------------------------------------------
[tool.pixi.environments]
# Development, type checking and docs: Python 3.14 with all optimizer libraries that
# can be installed together. nevergrad is left out because it pins an old version of
# bayesian-optimization; tao because it is Linux-only (see feature.tao).
default = { features = [
    "tests", "py314", "bayesopt", "fides", "gfo", "iminuit", "ipopt", "nag", "nlopt",
    "pygad", "pygmo", "pyswarms", "tranquilo",
], solve-group = "py314" }
type-checking = { features = [
    "type-checking", "py314", "bayesopt", "fides", "gfo", "iminuit", "ipopt", "nag",
    "nlopt", "pygad", "pygmo", "pyswarms", "tranquilo",
], solve-group = "py314" }
docs = { features = [
    "docs", "py314", "bayesopt", "fides", "gfo", "iminuit", "ipopt", "nag", "nlopt",
    "pygad", "pygmo", "pyswarms", "tranquilo",
], solve-group = "py314" }
# Main test environments: no optimizer libraries besides scipy. Linux adds JAX.
# Linux CI runs all supported Python versions. Every job that runs with only one Python
# version uses the second newest (3.14), because the newest often has problems. The main
# test environments are solved on their own, so that the optimizer libraries do not
# restrict the versions of optimagic's own dependencies.
tests-linux-py313 = { features = ["tests", "linux", "py313"] }
tests-linux-py314 = { features = ["tests", "linux", "py314"] }
tests-linux-py315 = { features = ["tests", "linux", "py315"] }
tests-py314 = { features = ["tests", "py314"] }
# Backward-compat CI
tests-old-pandas = { features = ["tests", "old-pandas", "py314"] }
# One environment per optimizer library (only run on Linux in CI)
tests-bayesopt = { features = ["tests", "py314", "bayesopt"] }
tests-fides = { features = ["tests", "py314", "fides"] }
tests-gfo = { features = ["tests", "py314", "gfo"] }
tests-iminuit = { features = ["tests", "py314", "iminuit"] }
tests-ipopt = { features = ["tests", "py314", "ipopt"] }
tests-nag = { features = ["tests", "py314", "nag"] }
tests-nevergrad = { features = ["tests", "py314", "nevergrad"] }
tests-nlopt = { features = ["tests", "py314", "nlopt"] }
tests-pygad = { features = ["tests", "py314", "pygad"] }
tests-pygmo = { features = ["tests", "py314", "pygmo"] }
tests-pyswarms = { features = ["tests", "py314", "pyswarms"] }
tests-tao = { features = ["tests", "py314", "tao"] }
tests-tranquilo = { features = ["tests", "py314", "tranquilo"] }
